name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: reek-custom
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/ruby-custom

      - name: Assert action completed with custom inputs
        run: |
          echo "PASS: reek ran successfully with custom tool_name and level"
