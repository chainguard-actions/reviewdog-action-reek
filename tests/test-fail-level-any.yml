name: Test fail_level any fails on smelly code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Ruby is available
        run: |
          if ! command -v gem >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
            $SUDO apt-get update
            $SUDO apt-get install -y ruby ruby-dev build-essential
          fi
          ruby --version
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
          tool_name: reek-strict
          workdir: tests/fixtures/smelly
      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because smells were found with fail_level=any"
            exit 1
          fi
          echo "PASS"
