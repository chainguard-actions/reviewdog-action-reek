name: Test reek_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Ruby and reek
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ruby ruby-dev build-essential
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> $GITHUB_PATH
          gem install -N reek

      - name: Install reviewdog (fallback)
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/fd59714416d6d9a1c0692d872e38e7f8448df4fc/install.sh \
            | sh -s -- -b /usr/local/bin v0.20.3 2>&1 || true

      - id: action
        uses: .
        with:
          github_token: dummy-token
          reporter: local
          filter_mode: nofilter
          fail_level: none
          reek_flags: '--no-color'
          workdir: .

      - name: Assert action completed with custom reek flags
        run: |
          echo "Action completed successfully with custom reek_flags"
          echo "PASS"
