name: Test with specific reek version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: dummy-token
          reek_version: '6.3.0'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          fail_on_error: 'false'
          workdir: tests/fixtures
      - name: Assert reek version installed
        run: |
          INSTALLED_VERSION=$(reek --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Installed reek version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "6.3.0" ]; then
            echo "FAIL: expected reek version 6.3.0 but got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS"
