name: Test reek_version input - specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reek_version: '6.1.1'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/ruby-clean

      - name: Assert action completed with specific reek version
        run: |
          echo "PASS: reek ran successfully with reek_version=6.1.1"
