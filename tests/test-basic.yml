name: Test basic usage - clean Ruby code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/ruby-clean

      - name: Assert action completed successfully
        run: |
          echo "PASS: reek ran on clean Ruby code without fatal errors"
