name: Test fail_level none - issues found but exit 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/ruby-smelly

      - name: Assert action exits 0 with fail_level none even when issues found
        run: |
          echo "PASS: action exited 0 with fail_level=none as expected"
